<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cannon Defender — Karthik Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh;
      margin: 0; padding: 0;
      background: #000; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
  <script src="../shared/phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"><\/script>');
    }
  </script>
  <script src="../shared/aicade-runtime.js"></script>
  <script>
    fetch("config.json")
      .then((response) => response.json())
      .then((configData) => {
        window._CONFIG = configData;
        const script = document.createElement("script");
        script.src = "game.js";
        document.body.appendChild(script);
      })
      .catch(err => console.error("Error loading config:", err));
  </script>
</head>
<body></body>
</html>
